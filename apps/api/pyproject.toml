[project]
name = "karolina-api"
version = "0.1.0"
description = "System KAROLINA - backend API"
requires-python = "==3.13.7"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0.41",
    "asyncpg>=0.30",
    "alembic>=1.16",
    "pydantic-settings>=2.9",
    "pydantic>=2.11",
    "boto3>=1.43.115",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.15.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.12",
    "mypy>=1.17",
    "aiosqlite>=0.22.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
